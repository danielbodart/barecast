name: CI
on:
  push:
    branches: [trunk]
permissions:
  contents: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-${{ hashFiles('.mise.toml') }}
      - name: Native lib cache keys
        id: libs
        run: |
          echo "datachannel=$(git rev-parse HEAD:packages/libdatachannel)" >> "$GITHUB_OUTPUT"
          echo "svtav1=$(git rev-parse HEAD:packages/svt-av1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .zig-cache/cmake
          key: libdatachannel-${{ runner.os }}-${{ steps.libs.outputs.datachannel }}-${{ hashFiles('.mise.toml') }}
      - uses: actions/cache@v4
        with:
          path: packages/svt-av1/Bin
          key: svtav1-${{ runner.os }}-${{ steps.libs.outputs.svtav1 }}-${{ hashFiles('.mise.toml') }}
      - name: CI
        run: ./run.ts ci
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
