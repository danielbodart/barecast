name: CI
on:
  push:
    branches: [trunk]
permissions:
  contents: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-${{ hashFiles('.mise.toml') }}
      - name: Libdatachannel cache key
        id: libdc
        run: echo "hash=$(git rev-parse HEAD:libdatachannel)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .zig-cache/cmake
          key: libdatachannel-${{ steps.libdc.outputs.hash }}-${{ hashFiles('.mise.toml') }}
      - name: CI
        run: ./run.ts ci
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
