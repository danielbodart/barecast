compatibility_date = "2025-02-03"
name = "barecast"
main = "src/index.ts"

[[routes]]
pattern = "barecast.bodar.com"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalingRoom"

[[migrations]]
tag = "v1"
new_classes = ["SignalingRoom"]
