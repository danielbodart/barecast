<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <title>zerocast</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            color: #aaa;
            font-family: 'IBM Plex Mono', monospace;
            min-height: 100vh;
        }

        body.hub {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 48px 40px 80px;
        }

        .hub-prompt {
            font-size: 13px;
            color: #555;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1a1a1a;
            width: 100%;
            max-width: 960px;
        }

        .prompt-dollar {
            color: #888;
        }

        .prompt-room {
            color: #3b82f6;
        }

        #share-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 960px;
        }

        #empty-state {
            color: #555;
            font-size: 14px;
            display: none;
        }

        #share-grid:empty + #empty-state { display: block; }
        #share-grid:not(:empty) + #empty-state { display: none; }

        /* ── Terminal-style Card ── */
        .card {
            background: #0f0f0f;
            border: 1px solid #1e1e1e;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .card:hover {
            border-color: #333;
            background: #111;
        }

        .card.viewing {
            border-color: rgba(59, 130, 246, 0.4);
        }

        /* Title bar */
        .card-titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #141414;
            border-bottom: 1px solid #1a1a1a;
            font-size: 11px;
            color: #555;
        }

        .titlebar-icon {
            color: #444;
            font-size: 11px;
            font-weight: 500;
        }

        .live-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .titlebar-text {
            flex: 1;
            font-size: 11px;
            color: #444;
            letter-spacing: 0.02em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .titlebar-protocol {
            font-size: 9px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #333;
        }

        .titlebar-badge {
            font-size: 9px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #3b82f6;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .card.viewing .titlebar-badge {
            opacity: 1;
        }

        /* Card body — terminal output style */
        .card-body {
            padding: 12px 14px 14px;
            font-size: 12px;
            line-height: 1.7;
        }

        .line {
            display: flex;
            gap: 8px;
        }

        .line-key {
            color: #444;
            min-width: 52px;
            text-align: right;
        }

        .line-val {
            color: #ccc;
        }

        .line-val.bright {
            color: #fff;
        }

        .line-val.blue {
            color: #3b82f6;
        }
    </style>
</head>
<body class="hub">
    <div id="room-name" class="hub-prompt"></div>
    <div id="share-grid"></div>
    <div id="empty-state">nobody sharing yet</div>
    <script src="/hub.js"></script>
</body>
</html>
