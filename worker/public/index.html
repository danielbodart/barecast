<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <title>zerocast</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/viewer.css">
</head>
<body class="install">
    <div class="install-page">
        <h1>zerocast</h1>
        <ul class="features">
            <li>Zero install — open a link, see the screen</li>
            <li>Zero latency — P2P WebRTC, hardware AV1 decode</li>
            <li>Zero fluff — screen only, no audio, no webcam</li>
        </ul>
        <button id="install-btn" disabled>Launch zerocast</button>
        <div id="room-input" class="room-input" hidden>
            <input type="text" id="room-field" placeholder="Room ID or URL" autocomplete="off" spellcheck="false">
            <div class="install-note">Paste a room link or enter a room ID</div>
        </div>
        <div id="install-note" class="install-note">Your browser will prompt you to install when ready.</div>
    </div>
    <script src="/install.js"></script>
</body>
</html>
