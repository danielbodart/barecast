<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <title>zerocast</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/viewer.css">
</head>
<body class="viewer">
    <div id="status">Connecting...</div>
    <div class="video-wrap"><video id="video" autoplay playsinline muted tabindex="0"></video></div>
    <div id="hud-toolbar">
        <span id="color-dot" class="viewer-color-dot"></span>
        <button id="mode-btn" class="hud-btn" title="Mode: draw (Tab to toggle)">draw</button>
    </div>
    <button id="toggle" class="hud-btn" title="Toggle zoom">1:1</button>
    <button id="info" class="hud-btn" title="Connection stats">info</button>
    <div id="stats-panel">
        <div class="stats-row"><span class="stats-label">res</span><span class="stats-value" id="s-res">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">fps</span><span class="stats-value" id="s-fps">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">bitrate</span><span class="stats-value" id="s-bitrate">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">rtt</span><span class="stats-value" id="s-rtt">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">codec</span><span class="stats-value" id="s-codec">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">lost</span><span class="stats-value" id="s-lost">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">jitter</span><span class="stats-value" id="s-jitter">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">via</span><span class="stats-value" id="s-via">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">decode</span><span class="stats-value" id="s-decode">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">jbuf</span><span class="stats-value" id="s-jbuf">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">process</span><span class="stats-value" id="s-process">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">delay</span><span class="stats-value" id="s-delay">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">e2e</span><span class="stats-value" id="s-e2e">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">dropped</span><span class="stats-value" id="s-dropped">&mdash;</span></div>
        <div class="stats-row"><span class="stats-label">decoder</span><span class="stats-value" id="s-decoder">&mdash;</span></div>
    </div>
    <script src="/viewer.js"></script>
</body>
</html>
